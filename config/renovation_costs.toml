# Renovation cost table: what the Renovation Estimate (Verbouwingsraming) prices, and the Case facts
# that trigger each item. Versioned like the Flag rules: bump `version` on any change to this file;
# the Case records it, so a change marks Verdicts built on the old table Achterhaald.
#
# Figures are public average prices (low–high, incl. btw), seeded from consumer price guides and
# Milieu Centraal; maintain them by hand and update `price_year` with the figure. They are estimates
# for decision support, not quotes.
#
# Per item:
#   id, label (Dutch UI), urgency: "direct" (Direct nodig), "within_5_years" (Binnen 5 jaar) or
#     "optional" (Optioneel); a trigger may set its own `urgency`, and the most urgent one that
#     holds wins.
#   basis: "fixed" (low/high in euros), "per_m2" (low/high per m² living area) or "size_band"
#     (low/high as three figures for a living area below, within and above `size_bands`). Without
#     a living area the middle band, or `assumed_living_area`, is used and the item says so.
#   triggers: conditions in the Flag rule vocabulary (app/flags.py) over the same fact keys
#     (`observation.<key>`, `finding.<topic>`, `energielabel.energy_label`, Listing facts such as
#     `construction_year` and `heating`). `also` lists extra conditions that must hold too. An item
#     no trigger holds for is left out, never guessed.
#   supersedes: ids dropped when this item is present.
#   inspection: true for a survey priced on the build year alone ("op basis van bouwjaar"), not
#     the repair itself.
#   source, price_year: where the figures come from and the year they are priced at.
version = 1
size_bands = [80, 150]
assumed_living_area = 115

