# Defaults for swappable runtime configuration. Overridden by environment.
# Model ids listed on ai.google.dev/gemini-api/docs/models on 2026-10-24.
# Image/PDF input support is NOT stated there: confirm on the model page at build time.
[llm]
vision_model = "gemini-3.8-flash"
verdict_model = "gemini-3.8-flash"

# Raw funda status string (casefolded) to normalised status.
# Unmapped strings are shown raw as "unknown". Add the real under-offer string
# here when first observed live.
[listing_status_map]
"beschikbaar" = "available"
"onder bod" = "negotiations"
"verkocht" = "sold"
"sold" = "sold"
"negotiations" = "negotiations"
"available" = "available"

# Case metrics. An asking price within this share of the Expected Sale Price is marktconform.
[case]
prijsstelling_band = 0.05

# The Guide Bid (Richtbod, ADR-0005): the Expected Sale Price less a discount by Prijsstelling,
# capped at the asking price and the Walk-away Maximum and rounded down. The model's opening bid
# stays within `band` of it. Starting guesses (the spec's 5-7% for hoog ingezet takes the middle),
# tuned against the regression set.
[guide_bid]
discount_hoog_ingezet = 0.06
discount_marktconform = 0.025
discount_laag_ingezet = 0.0
band = 0.03
rounding_step = 500
