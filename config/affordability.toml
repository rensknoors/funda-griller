# Dutch affordability rules, one table per year, plus one market rate snapshot shared by all years.
# Updating for a new year is a table change. Decision support, not advice.
#
# Which year applies: the table for the expected levering (today + `expected_levering_months` in
# settings), since the startersvrijstelling and the lender's norms follow the date of transfer.
#
# Sources and verification (checked 2026-11-09):
#   financing_ratio   Tijdelijke regeling hypothecair krediet (Trhk), Bijlage 1 tabel 1 (not yet
#                     AOW age, rente aftrekbaar). 2026: wetten.overheid.nl BWBR0032503 as of
#                     2026-01-01. 2027: Wijzigingsregeling hypothecair krediet 2027, Stcrt. 2026,
#                     38415 (published 2026-11-02). Both spot-checked against the worked maximum
#                     mortgages in Nibud, Advies hypotheeknormen 2027, tabel 3 and 4 (exact to the euro).
#                     Rows list the lowest toetsinkomen they apply from; rows identical to the one
#                     above are left out.
#   toetsrente        AFM minimum test rate for a rentevaste periode under ten years: 5% (Q1–Q3
#                     2026, Nibud advies 2027 §2.1.6). Ten years or longer tests at the offered rate.
#   single_bonus      Trhk art. 3 lid 8: an alleenstaande (not yet AOW age) with a toetsinkomen above
#                     the threshold may borrow this much more. 2026: €17.000 above €30.000 (Trhk
#                     2026-01-01); 2027: €18.000 above €31.000 (Stcrt. 2026, 38415).
#   debt_gross_up     Trhk art. 3a lid 2: the monthly cost of a DUO study loan is multiplied by this
#                     factor, per toetsrente column, before it comes off the allowed monthly cost.
#                     Nibud (advies 2027 §5.2) advises the same for other non-deductible loans.
#                     Unchanged for 2027 (advies 2027 tabel 8).
#   debts             How each kind of debt becomes a monthly toetslast; notes in
#                     .scratch/funda-griller/research/debt-weights.md (checked 2026-11-09).
#                     study_loan: Trhk art. 3a lid 1 and 3 (BWBR0032503, 2026-01-01): the termijnbedrag
#                     for interest and repayment, and while nothing is owed yet (studying, aanloopfase)
#                     or a lowered draagkracht amount is owed, the annuity on the actual debt, rate and
#                     remaining term. DUO, "Berekening maandbedrag": the wettelijk maandbedrag repays the
#                     debt within 35 years (SF35) or 15 years (SF15). A Mijn DUO amount may override it.
#                     revolving_credit, instalment_loan: NVB/Verbond Gedragscode Hypothecaire
#                     Financieringen (in force 2020-08-01, no later version found) §4 lid 5: at least 2%
#                     of the kredietlimiet a month for a doorlopend krediet, drawn or not; at least the
#                     contractual interest and repayment for an aflopend krediet.
#                     private_lease: UNVERIFIED. No primary source states the share; BKR registers new
#                     contracts (from 2022-04-01) at 100% of the contract amount, and lenders are
#                     reported (secondary) to count the full monthly term.
#                     other: the monthly amount as entered.
#                     gross_up: Trhk art. 3a lid 2 prescribes the debt_gross_up for study loans only;
#                     Nibud (advies 2026 hst. 8, advies 2027 §5.2) advises it for every non-deductible
#                     obligation, consumer credit and private lease included. Lenders vary; on for
#                     every kind here, the prudent reading.
#   energy_label_bonus  Trhk art. 4 lid 3; unchanged for 2027 (advies 2027 tabel 6).
#   nhg               nhg.nl Voorwaarden en normen 2026-1: €470.000 (€498.200 with energy-saving
#                     measures), borgtochtprovisie 0,4%.
#                     2027: €500.000 (€530.000 with energy-saving measures), borgtochtprovisie
#                     0,4% (nhg.nl, "NHG-grens in 2027 naar 500.000 euro", 2026-10-13).
#   transfer_tax      2% for an owner-occupied home. Startersvrijstelling per buyer for their own
#                     share, aged 18 to 34 at levering, once in a lifetime, whole price at or below
#                     the limit (Belastingdienst, Rijksoverheid). Limit 2026 €555.000 (SRA, 2026-01);
#                     2027 €615.000 is the Belastingplan 2027 proposal, NOT YET LAW.
#   tax               Hypotheekrenteaftrek at most at the second-bracket rate: 2026 37,56%, 2027
#                     38,16% (estimate from Prinsjesdag 2026, Nibud advies 2027 tabel 2).
#                     Eigenwoningforfait 0,35% up to the villataks threshold (2026 €1.350.000,
#                     2027 €1.360.000 proposed), 2,35% above. The asking price stands in for the WOZ.
#   fixed_costs       ESTIMATE: midpoints of ranges quoted by lenders (notary 1000-1500, valuation
#                     400-900, advice 1500-4000).
#   max_ltv           Hypotheek at most 100% of the market value (Trhk art. 4): kosten koper and
#                     renovation come from own funds and equity.

# Bump on any change to this file: the Case records it, so Verdicts built on the old table become
# Achterhaald.
version = 3

# Offered mortgage rates, ten years fixed, annuity: the test rate for a rentevaste periode of ten
# years or longer and the rate the monthly cost is worked out at. A market snapshot, not a year
# rule: update by hand. Source: Van Bruggen rente-index, 2026-11-02 (averages; with NHG 4,40%,
# without 4,78%).
[market_rate]
as_of = 2026-11-02
nhg = 0.0440
no_nhg = 0.0478

[years.2026]
toetsrente = 0.05
term_months = 360
max_ltv = 1.00

