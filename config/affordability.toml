# Dutch affordability rules, one table per year. Updating for a new year is a table change.
# Figures are modelling assumptions, not advice: check them against the Nibud and
# Rijksoverheid tables for the year before relying on them.

[years.2026]
# Interest rate and term the lender tests the maximum mortgage against.
test_rate = 0.05
term_months = 360
# Rate assumed for the monthly cost of the mortgage actually needed.
mortgage_rate = 0.04

# Share of gross annual income that may go to housing, by income band (first band that fits;
# a band without up_to is open-ended).
housing_ratio = [
  { up_to = 30000, ratio = 0.20 },
  { up_to = 50000, ratio = 0.26 },
  { up_to = 80000, ratio = 0.30 },
  { up_to = 120000, ratio = 0.33 },
  { ratio = 0.35 },
]

# Extra borrowing capacity for an energy-efficient house, by energielabel.
[years.2026.energy_label_bonus]
"A++++" = 40000
"A+++" = 30000
"A++" = 25000
"A+" = 20000
"A" = 10000

[years.2026.transfer_tax]
rate = 0.02
# Exempt when every adult is within the age range and the price is at or below the limit.
starter_min_age = 18
starter_max_age = 34
starter_price_limit = 525000

# Fixed kosten koper, in euro.
[years.2026.fixed_costs]
notary = 1800
valuation = 700
advice = 3500
