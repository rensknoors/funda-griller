[project]
name = "funda-griller-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.136.0",
  "uvicorn==0.46.0",
  "pydantic-settings==2.14.0",
  "pyfunda==3.1.5",
  "tls-client<2.0",
  "python-multipart==0.0.32",
  "pypdf==6.1.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "httpx==0.28.1",
  "import-linter==2.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Ports are pure types: no adapters, storage, settings or app wiring"
type = "forbidden"
source_modules = ["app.ports"]
forbidden_modules = ["app.production_ports", "app.store", "app.settings", "app.main", "app.wiring", "app.routes", "app.assembly"]

[[tool.importlinter.contracts]]
name = "Case builder, Findings and the Markdown export are pure: no adapters, storage, settings, rules loading, LLM client or app wiring"
type = "forbidden"
source_modules = ["app.case", "app.affordability", "app.flags", "app.comparison", "app.findings", "app.export"]
forbidden_modules = [
  "app.ports",
  "app.production_ports",
  "app.pyfunda_provider",
  "app.gemini_client",
  "app.source_clients",
  "app.source_runner",
  "app.store",
  "app.settings",
  "app.rules_loader",
  "app.main",
  "app.wiring",
  "app.routes",
  "app.assembly",
]

[[tool.importlinter.contracts]]
name = "Photos and Observations reach the outside world only through ports: no adapters, settings or app wiring"
type = "forbidden"
source_modules = ["app.photos", "app.observations"]
forbidden_modules = [
  "app.gemini_client",
  "app.photo_downloader",
  "app.production_ports",
  "app.settings",
  "app.main",
  "app.wiring",
  "app.routes",
  "app.assembly",
]

[[tool.importlinter.contracts]]
name = "Verdict service reaches the LLM only through the port: no adapters, storage, settings or app wiring"
type = "forbidden"
source_modules = ["app.verdict"]
forbidden_modules = [
  "app.gemini_client",
  "app.production_ports",
  "app.store",
  "app.settings",
  "app.main",
  "app.wiring",
  "app.routes",
  "app.assembly",
]
